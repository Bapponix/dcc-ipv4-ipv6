id:"vpn-gre-stappen",
label:"VPN deel 1 · GRE",
title:"VPN deel 1 — PC's, routers, OSPF en GRE",
html:`
<h3>Stap 1 — PC's configureren</h3>
<p>Open iedere pc in Packet Tracer en ga naar Desktop → IP Configuration.</p>
<table>
<tr><th>PC</th><th>IP-adres</th><th>Subnetmasker</th><th>Gateway</th></tr>
<tr><td>PC1</td><td>192.168.1.10</td><td>255.255.255.0</td><td>192.168.1.1</td></tr>
<tr><td>PC2</td><td>192.168.2.10</td><td>255.255.255.0</td><td>192.168.2.1</td></tr>
<tr><td>PC3</td><td>192.168.3.10</td><td>255.255.255.0</td><td>192.168.3.1</td></tr>
</table>

<h3>Stap 2 — Routers configureren</h3>
<p>Configureer FastEthernet en Serial. Gebruik een /24-masker voor de LAN's en /30 voor de WAN-links.</p>

<h3>Router 1</h3>
<pre>enable
configure terminal
hostname R1
interface fastethernet0/0
ip address 192.168.1.1 255.255.255.0
no shutdown
exit
interface serial0/0/0
ip address 10.1.1.1 255.255.255.252
no shutdown
exit</pre>

<h3>Router 2</h3>
<pre>enable
configure terminal
hostname R2
interface fastethernet0/0
ip address 192.168.2.1 255.255.255.0
no shutdown
exit
interface serial0/0/0
ip address 10.1.1.2 255.255.255.252
no shutdown
exit
interface serial0/0/1
ip address 10.2.2.1 255.255.255.252
no shutdown
exit</pre>

<h3>Router 3</h3>
<pre>enable
configure terminal
hostname R3
interface fastethernet0/0
ip address 192.168.3.1 255.255.255.0
no shutdown
exit
interface serial0/0/0
ip address 10.2.2.2 255.255.255.252
no shutdown
exit</pre>

<div class="callout"><strong>Clock rate:</strong> gebruik <code>clock rate 64000</code> alleen op een seriële DCE-interface. Controleer de DCE-kant met <code>show controllers serial 0/0/0</code> en pas het interfacenummer aan.</div>

<h3>Stap 3 — Routingprotocol kiezen</h3>
<p>Je kunt EIGRP of OSPF gebruiken. In deze oefening kiezen we OSPF.</p>

<h3>Stap 4 — OSPF instellen</h3>
<p>Gebruik OSPF-procesnummer 23 en area 0.</p>

<h3>Router 1</h3>
<pre>enable
configure terminal
router ospf 23
network 192.168.1.0 0.0.0.255 area 0
network 10.1.1.0 0.0.0.3 area 0
exit</pre>

<h3>Router 2</h3>
<pre>enable
configure terminal
router ospf 23
network 192.168.2.0 0.0.0.255 area 0
network 10.1.1.0 0.0.0.3 area 0
network 10.2.2.0 0.0.0.3 area 0
exit</pre>

<h3>Router 3</h3>
<pre>enable
configure terminal
router ospf 23
network 192.168.3.0 0.0.0.255 area 0
network 10.2.2.0 0.0.0.3 area 0
exit</pre>

<h3>OSPF controleren</h3>
<pre>show ip ospf neighbor
show ip route ospf
show ip protocols</pre>

<h3>Stap 5 — Wachtwoorden maken</h3>
<p>Voer onderstaande configuratie uit op alle drie de routers.</p>

<h3>Consolewachtwoord</h3>
<pre>enable
configure terminal
line console 0
password cisco
login
exit</pre>

<h3>Enable-wachtwoord</h3>
<pre>enable secret cisco</pre>

<h3>VTY-wachtwoord</h3>
<pre>line vty 0 15
password cisco
login
exit</pre>

<h3>Wachtwoorden versluieren</h3>
<pre>service password-encryption
end
copy running-config startup-config</pre>

<div class="callout"><strong>Beveiliging:</strong> het wachtwoord 'cisco' is alleen bedoeld voor een oefening. service password-encryption is zwakke, omkeerbare versluiering. Gebruik in productie sterke wachtwoorden, SSH en veilige authenticatie.</div>

<h3>Stap 6 — GRE-tunnel maken</h3>
<p>We maken een GRE-tunnel van Router 1 naar Router 3 over Router 2.</p>

<h3>Router 1 — Linkerkant</h3>
<pre>enable
configure terminal
interface tunnel0
ip address 172.16.13.1 255.255.255.252
tunnel source serial0/0/0
tunnel destination 10.2.2.2
tunnel mode gre ip
no shutdown
exit</pre>

<h3>Router 3 — Rechterkant</h3>
<pre>enable
configure terminal
interface tunnel0
ip address 172.16.13.2 255.255.255.252
tunnel source serial0/0/0
tunnel destination 10.1.1.1
tunnel mode gre ip
no shutdown
exit</pre>

<h3>Tunnel testen</h3>
<p>Vanaf Router 1:</p>
<pre>ping 172.16.13.2
show interfaces tunnel0
show ip interface brief</pre>

<p>Vanaf Router 3:</p>
<pre>ping 172.16.13.1
show interfaces tunnel0</pre>

<div class="success"><strong>GRE-tunnel ingesteld.</strong> Als de tunneladressen elkaar bereiken, werkt de GRE-verbinding. GRE versleutelt het verkeer niet.</div>
`

id:"vpn-ipsec-stappen",
label:"VPN deel 2 · IPsec",
title:"VPN deel 2 — IPsec configureren",
html:`
<p>Nu configureren we een site-to-site IPsec VPN tussen Router 1 en Router 3. De configuratie hieronder beschermt LAN-naar-LAN-verkeer rechtstreeks met IPsec.</p>

<div class="callout"><strong>Belangrijk:</strong> dit is een aparte IPsec-configuratie naast de GRE-tunnel. Voor versleuteling van het GRE-verkeer zelf is een aangepaste GRE-over-IPsec-configuratie nodig.</div>

<h3>Stap 7 — Router 1</h3>

<h3>1. Access-list maken</h3>
<p>Deze ACL selecteert verkeer van LAN 1 naar LAN 3.</p>
<pre>enable
configure terminal
access-list 110 permit ip 192.168.1.0 0.0.0.255 192.168.3.0 0.0.0.255</pre>

<h3>2. ISAKMP-policy maken</h3>
<pre>crypto isakmp policy 10
encryption aes 256
hash sha
authentication pre-share
group 14
lifetime 86400
exit</pre>

<p>De lifetime is 86400 seconden, oftewel 24 uur. De beide routers moeten compatibele IKE-instellingen gebruiken.</p>

<h3>3. Pre-shared key</h3>
<pre>crypto isakmp key vpnpa55 address 10.2.2.2</pre>

<p>Het peer-adres is het WAN-adres van Router 3.</p>

<h3>4. IPsec transform-set</h3>
<pre>crypto ipsec transform-set vpn-set esp-aes esp-sha-hmac</pre>

<h3>5. Crypto map</h3>
<pre>crypto map vpn-map 10 ipsec-isakmp
description VPN connection to R3
set peer 10.2.2.2
set transform-set vpn-set
match address 110
exit</pre>

<h3>6. Crypto map toepassen</h3>
<pre>interface serial0/0/0
crypto map vpn-map
exit
end
copy running-config startup-config</pre>

<h3>Stap 8 — Router 3</h3>

<h3>1. Access-list maken</h3>
<p>Op Router 3 worden de bron- en bestemmingsnetwerken omgedraaid.</p>
<pre>enable
configure terminal
access-list 110 permit ip 192.168.3.0 0.0.0.255 192.168.1.0 0.0.0.255</pre>

<h3>2. ISAKMP-policy</h3>
<pre>crypto isakmp policy 10
encryption aes 256
hash sha
authentication pre-share
group 14
lifetime 86400
exit</pre>

<h3>3. Pre-shared key</h3>
<pre>crypto isakmp key vpnpa55 address 10.1.1.1</pre>

<h3>4. Transform-set</h3>
<pre>crypto ipsec transform-set vpn-set esp-aes esp-sha-hmac</pre>

<h3>5. Crypto map</h3>
<pre>crypto map vpn-map 10 ipsec-isakmp
description VPN connection to R1
set peer 10.1.1.1
set transform-set vpn-set
match address 110
exit</pre>

<h3>6. Crypto map toepassen</h3>
<pre>interface serial0/0/0
crypto map vpn-map
exit
end
copy running-config startup-config</pre>

<h3>Stap 9 — VPN testen</h3>
<p>Controleer de IKE- en IPsec-verbinding:</p>
<pre>show crypto isakmp sa
show crypto ipsec sa
show crypto map
show access-lists 110</pre>

<p>Open op PC1 de Command Prompt en ping PC3:</p>
<pre>ping 192.168.3.10</pre>

<p>Controleer daarna opnieuw:</p>
<pre>show crypto ipsec sa</pre>

<p>De encaps- en decaps-tellers moeten toenemen wanneer verkeer door de VPN gaat.</p>

<div class="success"><strong>IPsec VPN ingesteld.</strong> De VPN is pas daadwerkelijk werkend wanneer de IKE/IPsec-beveiligingsassociaties actief zijn en de versleutelde verkeerstellers oplopen.</div>

<div class="callout"><strong>Let op:</strong> niet iedere Packet Tracer-router ondersteunt AES-256, SHA en DH-groep 14. Controleer de beschikbare commando's met <code>?</code>. Voor echte netwerken zijn moderne IKEv2- en IPsec-instellingen aanbevolen.</div>
`

const order=["ipv4","ipv6","vlan","tunnels","overig"];
const catbar=document.getElementById("catbar");
const subbar=document.getElementById("subbar");
const main=document.getElementById("main");

function openPage(catId,pageId,updateHash=true){
  const category=DATA[catId];
  if(!category) return;
  const page=category.pages.find(p=>p.id===pageId);
  if(!page) return;

  document.querySelectorAll(".cat").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.cat===catId
    );
  });

  subbar.innerHTML="";
  category.pages.forEach(p=>{
    const button=document.createElement("button");
    button.className="subtab"+(p.id===pageId?" active":"");
    button.textContent=p.label;
    button.addEventListener("click",()=>{
      openPage(catId,p.id);
    });
    subbar.appendChild(button);
  });

  main.innerHTML=`
    <section class="panel">
      <div class="kicker">${category.label.toUpperCase()}</div>
      <h2>${page.title}</h2>
      ${page.html}
    </section>
  `;

  main.querySelectorAll("pre").forEach(pre=>{
    const button=document.createElement("button");
    button.className="copy-btn";
    button.textContent="Kopieer";
    button.addEventListener("click",async()=>{
      const code=pre.querySelector("code");
      const content=code?code.innerText:pre.innerText;
      try{
        await navigator.clipboard.writeText(content);
        button.textContent="Gekopieerd!";
        setTimeout(()=>button.textContent="Kopieer",1500);
      }catch(error){
        button.textContent="Selecteer tekst";
      }
    });
    pre.parentNode.insertBefore(button,pre);
  });

  if(updateHash){
    history.replaceState(null,"","#"+pageId);
  }
  window.scrollTo(0,0);
}

function openCategory(catId){
  openPage(catId,DATA[catId].pages[0].id);
}

order.forEach(catId=>{
  const button=document.createElement("button");
  button.className="cat";
  button.dataset.cat=catId;
  button.textContent=DATA[catId].label;
  button.addEventListener("click",()=>openCategory(catId));
  catbar.appendChild(button);
});

function loadFromHash(){
  const hash=location.hash.substring(1);
  for(const catId of order){
    const page=DATA[catId].pages.find(p=>p.id===hash);
    if(page){
      openPage(catId,page.id,false);
      return;
    }
  }
  openPage("ipv4","ipv4-routers",false);
}

window.addEventListener("hashchange",loadFromHash);
loadFromHash();

})();
